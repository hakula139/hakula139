name: Update WakaTime heatmap

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/wakatime-heatmap.py
      - .github/workflows/wakatime.yml

concurrency:
  group: wakatime-heatmap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate WakaTime heatmap
        run: python3 .github/scripts/wakatime-heatmap.py dist

      - name: Publish WakaTime heatmap
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: wakatime-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
